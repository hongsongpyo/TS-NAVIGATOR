<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TS Navigator</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>

<body>
  <main class="home-shell">
    <header class="home-header">
      <div class="brand">
        TS Navigator
      </div>

      <div class="maker">
        Made by Songpyo Hong
      </div>
    </header>

    <section class="home-content">
      <label class="upload-card" for="csvInput">
        <input
          id="csvInput"
          type="file"
          accept=".csv,text/csv"
          hidden
        />

        <span id="uploadText" class="upload-title">
          분석할 CSV 파일을 업로드하기
        </span>
      </label>

      <div class="uploaded-file-panel">
        <button
          id="fileListToggle"
          class="file-list-toggle"
          type="button"
        >
          업로드된 파일
        </button>

        <div id="fileName" class="file-name">
          아직 업로드된 파일이 없습니다.
        </div>

        <div id="filePreview" class="file-preview hidden">
          <div class="file-preview-title">
            File Preview
          </div>

          <div class="file-preview-body">
            CSV 파일을 업로드하면 파일명, 행 수, 날짜 컬럼, target 컬럼, 추정 주기가 표시됩니다.
          </div>
        </div>
      </div>

      <div class="home-actions">
        <button
          id="startBtn"
          class="start-btn disabled"
          type="button"
          disabled
        >
          Workspace 열기
        </button>

        <button
          class="sample-btn"
          type="button"
          onclick="window.TSUpload?.loadSampleCSV()"
        >
          샘플 데이터 불러오기
        </button>
      </div>
    </section>
  </main>

  <script src="js/state.js"></script>

  <script src="js/utils/dateUtils.js"></script>
  <script src="js/utils/mathUtils.js"></script>
  <script src="js/utils/csvUtils.js"></script>
  <script src="js/utils/sampleData.js"></script>

  <script src="js/upload.js"></script>
</body>
</html>
