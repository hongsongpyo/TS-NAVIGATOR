<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TS Navigator Workspace</title>

    <!-- =====================================================
         CSS
         ===================================================== -->

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/workspace.css" />

    <link rel="stylesheet" href="./css/inspector.css" />
    <link rel="stylesheet" href="./css/timeline.css" />
    <link rel="stylesheet" href="./css/region.css" />

    <link rel="stylesheet" href="./css/popup.css" />
    <link rel="stylesheet" href="./css/assistant.css" />
  </head>

  <body>
    <main class="workspace-page">
      <!-- ===================================================
           Header
           =================================================== -->

      <header class="workspace-header">
        <div class="workspace-header-left">
          <button id="homeButton">Home</button>

          <div class="workspace-title">
            <h1>TS Navigator Workspace</h1>
            <span id="workspaceFileName">No file loaded</span>
          </div>

          <div
            class="workspace-status"
            id="workspaceProjectStatus"
          >
            Empty
          </div>
        </div>

        <div class="workspace-header-right">
          <button id="saveProjectButton">
            Save
          </button>

          <button id="resetProjectButton">
            Reset
          </button>
        </div>
      </header>

      <!-- ===================================================
           Workspace Layout
           =================================================== -->

      <section
        class="workspace-layout"
        id="workspaceLayout"
        data-inspector="open"
      >
        <!-- ===============================================
             Track Inspector
             =============================================== -->

        <aside
          class="workspace-column track-inspector-column"
          id="trackInspector"
        >
          <div class="workspace-column-inner">
            <!-- inspector.js -->
          </div>
        </aside>

        <!-- ===============================================
             Track Timeline
             =============================================== -->

        <aside
          class="workspace-column track-timeline-column"
          id="trackTimeline"
        >
          <div class="workspace-column-inner">
            <!-- timeline.js -->
          </div>
        </aside>

        <!-- ===============================================
             Visualization Region
             =============================================== -->

        <section
          class="workspace-column visualization-region-column"
          id="visualizationRegions"
        >
          <div class="workspace-column-inner">
            <!-- regions.js -->
          </div>
        </section>
      </section>

      <!-- ===================================================
           Popup Root
           =================================================== -->

      <div id="processPopupRoot"></div>

      <!-- ===================================================
           AI Assistant Root
           =================================================== -->

      <div id="aiAssistantRoot"></div>
    </main>

    <!-- =====================================================
         Plotly
         ===================================================== -->

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <!-- =====================================================
         State
         ===================================================== -->

    <script src="./js/state.js"></script>

    <!-- =====================================================
         Utils
         ===================================================== -->

    <script src="./js/utils/mathUtils.js"></script>
    <script src="./js/utils/dateUtils.js"></script>
    <script src="./js/utils/csvUtils.js"></script>
    <script src="./js/utils/sampleData.js"></script>

    <!-- =====================================================
         Analysis
         ===================================================== -->

    <script src="./js/analysis/dataStructure.js"></script>
    <script src="./js/analysis/preprocessing.js"></script>
    <script src="./js/analysis/denoising.js"></script>
    <script src="./js/analysis/decomposition.js"></script>
    <script src="./js/analysis/forecasting.js"></script>
    <script src="./js/analysis/metrics.js"></script>

    <!-- =====================================================
         Charts
         ===================================================== -->

    <script src="./js/charts/chartCore.js"></script>
    <script src="./js/charts/timeSeriesChart.js"></script>
    <script src="./js/charts/forecastChart.js"></script>
    <script src="./js/charts/metricChart.js"></script>
    <script src="./js/charts/interaction.js"></script>

    <!-- =====================================================
         UI
         ===================================================== -->

    <script src="./js/ui/inspector.js"></script>
    <script src="./js/ui/timeline.js"></script>
    <script src="./js/ui/regions.js"></script>
    <script src="./js/ui/popup.js"></script>
    <script src="./js/ui/assistant.js"></script>

    <!-- =====================================================
         Layout / Upload / App
         ===================================================== -->

    <script src="./js/layout.js"></script>
    <script src="./js/upload.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
